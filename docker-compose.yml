services:
  db:
    image: postgres:16-alpine
    container_name: msxfit-db
    environment:
      POSTGRES_DB: msxfit
      POSTGRES_USER: msxfit
      POSTGRES_PASSWORD: msxfit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msxfit -d msxfit"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: msxfit-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
