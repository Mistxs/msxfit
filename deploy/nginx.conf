# nginx-сайт для mistxs | fitness.
# Фронт (собранный dist/) раздаётся статикой, /api и /health проксируются на gunicorn.
# Устанавливается: deploy/apply-nginx.sh (или вручную — см. README).
server {
    listen 80;
    listen [::]:80;
    server_name fit.mistxs.ru;

    root /home/mistxs/msxfit/frontend/dist;
    index index.html;

    # Фото этикеток могут быть тяжёлыми.
    client_max_body_size 16M;

    # SPA (vue-router history mode) — отдаём index.html для всех «нефайловых» путей.
    # Хешированные ассеты — кэш 30д (иммутабельны); index.html — без кэша, чтобы всегда свежий билд.
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|gif|ico)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:7800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:7800/health;
    }
}
